version: "3.8"

services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nextjs-app

    ports:
      - "3000:3000"

    env_file:
      - .env.local

    environment:
      NODE_ENV: production

    restart: always

  jenkins:
    image: jenkins/jenkins:lts-jdk21

    container_name: jenkins

    restart: always

    privileged: true

    user: root

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: